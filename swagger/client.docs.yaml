tags:
  - name: Client
    description: Routes client

paths:
  /api/Client/getHotelInformations:
    get:
      summary: Récupère les informations de l’hôtel
      tags: [Client]
      responses:
        '200':
          description: Les informations renvoyées avec succès
          content:
            application/json:
              schema:
                type: array
                $ref: '#/components/schemas/HotelInformation'


  /api/Client/getAllRooms:
    get:
      summary: Récupère la liste de toutes les chambres non reservées
      tags: [Client]
      responses:
        '200':
          description: Liste des chambres renvoyée avec succès
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Room'


  /api/client/findRoomById/{id}:
    get:
      summary: Trouve une chambre non reservée par son ID
      tags: [Client]
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: ID de la chambre
      responses:
        '200':
          description: Retourne les informations trouvées de la chambre
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/Room'
        '404':
          description: Ressource introuvable


  /api/Client/createReservation:
    post:
      summary: Reservation d'une chambre
      tags: [Client]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                clientId:
                  type: integer
                  description: ID client
                  example: 1
                roomId:
                  type: integer
                  description: ID chambre
                  example: 2
      responses:
        '201':
          description: Réservation créée
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/ReservationRoom'
        '401':
          description: Veuillez vérifier vos champs
        '404':
          description: Ressource introuvable
        '409':
          description: Impossible de réserver cette chambre, elle est déjà occupée


  /api/Client/cancelReservation:
    post:
      summary: Annule une réservation
      tags: [Client]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                clientId:
                  type: integer
                  description: ID client
                  example: 1
                roomId:
                  type: integer
                  description: ID chambre
                  example: 2
      responses:
        '200':
          description: Réservation annulée
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/CancelReservationRoom'
        '400':
          description: Impossible d'annuler la reservation parce qu'elle n'est pas attribuée à ce client
        '404':
          description: Ressource introuvable
        '409':
          description: Chambre non réservée pour être annulée
  
components:
  schemas:
    HotelInformation:
      type: object
      properties:
        name:
          type: string
          example: Grand Hotel
          description: Nom de l'hotel
        location:
          type: object
          properties:
            address:
              type: string
            city:
              type: string
            state:
              type: string
            zip:
              type: string
            country:
              type: string
        contact:
          type: object
          properties:
            phone:
              type: string
            email:
              type: string
        facilities:
          type: array
          items:
            type: string
        Bedrooms: 
          type: integer
        

    
    Room:
      type: object
      properties:
        id:
          type: integer
          example: 1
          description: ID de la chambre
        number:
          type: integer
          example: 101
          description: Numéro de la chambre
        name:
          type: string
          example: Standard Room
          description: Nom de la chambre
        description:
          type: string
          example: A comfortable room with two double beds and a private bathroom
          description: Description de la chambre
        capacity:
          type: integer
          example: 20
          description: Capacité de la chambre
        price:
          type: integer
          example: 180
          description: Prix de la chambre
        reserved:
          type: boolean
          example: false
          description: statut de la réservation
        clientId:
          type: integer
          example: null
          description: ID du client ayant fait la reservation
        reservedAt:
          type: string
          example: null
          description: Date de reservation
        cancelReservationAt:
          type: string
          description: Date d'annulation de la reservation

    ReservationRoom:
      type: object
      properties:
        id:
          type: integer
          example: 1
          description: ID de la chambre
        number:
          type: integer
          example: 101
          description: Numéro de la chambre
        name:
          type: string
          example: Standard Room
          description: Nom de la chambre
        description:
          type: string
          example: A comfortable room with two double beds and a private bathroom
          description: Description de la chambre
        capacity:
          type: integer
          example: 20
          description: Capacité de la chambre
        price:
          type: integer
          example: 180
          description: Prix de la chambre
        reserved:
          type: boolean
          description: statut de la réservation
        clientId:
          type: integer
          example: 2
          description: ID du client ayant fait la reservation
        reservedAt:
          type: string
          example: 2025-11-12T17:48:05.080Z
          description: Date de reservation
        cancelReservationAt:
          type: string
          example: null
          description: Date d'annulation de la reservation

    CancelReservationRoom:
      type: object
      properties:
        id:
          type: integer
          example: 1
          description: ID de la chambre
        number:
          type: integer
          example: 101
          description: Numéro de la chambre
        name:
          type: string
          example: Standard Room
          description: Nom de la chambre
        description:
          type: string
          example: A comfortable room with two double beds and a private bathroom
          description: Description de la chambre
        capacity:
          type: integer
          example: 20
          description: Capacité de la chambre
        price:
          type: integer
          example: 180
          description: Prix de la chambre
        reserved:
          type: boolean
          example: false
          description: statut de la réservation
        clientId:
          type: integer
          example: null
          description: ID du client ayant fait la reservation
        reservedAt:
          type: string
          example: null
          description: Date de reservation
        cancelReservationAt:
          type: string
          example: 2025-11-12T17:48:05.080Z
